# 推送到默认分支后自动构建 React 原型并发布到 GitHub Pages（公开链接，类似 Figma Published）。
# 首次启用：仓库 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」。
name: Deploy Feature Store (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "prototypes/feature-widetable/**"
      - ".github/workflows/deploy-feature-store-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-feature-store
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: prototypes/feature-widetable/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: prototypes/feature-widetable
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: prototypes/feature-widetable
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: prototypes/feature-widetable/dist

      - id: deployment
        uses: actions/deploy-pages@v4
