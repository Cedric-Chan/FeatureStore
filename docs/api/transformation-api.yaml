openapi: 3.1.0
info:
  title: Transformation API
  version: 1.0.0-mvp
  description: |
    CRUD, Version management, Test, and Manage operations for Transformation.
    Aligns with architecture doc §4.2 and 産品原型図 §3.2.

servers:
  - url: /api/v1

paths:
  /transformations:
    get:
      operationId: listTransformations
      summary: List Transformations with optional filters
      parameters:
        - name: name
          in: query
          schema: { type: string }
          description: Fuzzy match on Transformation name
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/TransformationType" }
        - name: language
          in: query
          schema: { $ref: "#/components/schemas/ScriptLanguage" }
        - name: region
          in: query
          schema: { type: string }
        - name: creator
          in: query
          schema: { type: string }
        - name: ownedByMe
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated list with rowspan grouping by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TransformationVersion" }

    post:
      operationId: createTransformation
      summary: Create a new Transformation (first version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransformationCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationVersion" }
        "400":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /transformations/{tfName}:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTransformation
      summary: Get all versions of a Transformation
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/TransformationVersion" }

  /transformations/{tfName}/versions:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: addTransformationVersion
      summary: Add a new version (optionally copy from existing version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransformationVersionCreate" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationVersion" }

  /transformations/{tfName}/versions/{version}:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getTransformationVersion
      summary: Get a specific version detail
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationVersion" }
    put:
      operationId: updateTransformationVersion
      summary: Update a version (only DRAFT status)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransformationVersionUpdate" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationVersion" }
        "409":
          description: Not in DRAFT status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /transformations/{tfName}/versions/{version}/manage:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: manageTransformationVersion
      summary: State transition (Enable / Disable / Draft / Delete)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [enable, disable, draft, delete]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransformationVersion" }
        "409":
          description: Invalid state transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /transformations/{tfName}/versions/{version}/test:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: testTransformation
      summary: Execute a test run for a specific version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, inputParams]
              properties:
                region: { type: string }
                inputParams:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success, failed] }
                  outputParams:
                    type: object
                    additionalProperties: true
                  durationMs: { type: integer }
                  errorMessage: { type: string }

  /transformations/{tfName}/versions/{version}/test/history:
    parameters:
      - name: tfName
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: listTransformationTestHistory
      summary: List test history for this version
      parameters:
        - name: region
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [success, failed] }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TestHistoryEntry" }

components:
  schemas:
    TransformationType:
      type: string
      enum: [Scalar, Aggregator]
      description: |
        ScalarFunction (Map -> Map) or AggregateFunction (List<Map> -> Map).

    ScriptLanguage:
      type: string
      enum: [groovy, python]

    TransformationStatus:
      type: string
      enum: [DRAFT, ENABLED, DISABLED, PENDING]

    TransformationVersion:
      type: object
      properties:
        name: { type: string }
        version: { type: integer }
        type: { $ref: "#/components/schemas/TransformationType" }
        language: { $ref: "#/components/schemas/ScriptLanguage" }
        status: { $ref: "#/components/schemas/TransformationStatus" }
        regions:
          type: array
          items: { type: string }
        script: { type: string }
        inputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        outputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        owner: { type: string }
        creator: { type: string }
        description: { type: string }
        createTime: { type: string, format: date-time }

    TransformationCreate:
      type: object
      required: [name, type, language, regions, script, outputParams]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/TransformationType" }
        language: { $ref: "#/components/schemas/ScriptLanguage" }
        regions:
          type: array
          items: { type: string }
        script: { type: string }
        inputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        outputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        owner: { type: string }
        description: { type: string }

    TransformationVersionCreate:
      type: object
      properties:
        copyFromVersion:
          type: integer
          description: If set, copies config from specified version
        type: { $ref: "#/components/schemas/TransformationType" }
        language: { $ref: "#/components/schemas/ScriptLanguage" }
        regions:
          type: array
          items: { type: string }
        script: { type: string }
        inputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        outputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        owner: { type: string }
        description: { type: string }

    TransformationVersionUpdate:
      type: object
      properties:
        type: { $ref: "#/components/schemas/TransformationType" }
        language: { $ref: "#/components/schemas/ScriptLanguage" }
        regions:
          type: array
          items: { type: string }
        script: { type: string }
        inputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        outputParams:
          type: array
          items: { $ref: "#/components/schemas/ParamDef" }
        owner: { type: string }
        description: { type: string }

    ParamDef:
      type: object
      required: [name, dataType]
      properties:
        name: { type: string }
        dataType: { type: string }

    TestHistoryEntry:
      type: object
      properties:
        id: { type: string }
        region: { type: string }
        createTime: { type: string, format: date-time }
        operator: { type: string }
        status: { type: string, enum: [success, failed] }
        inputParams: { type: object, additionalProperties: true }
        outputParams: { type: object, additionalProperties: true }
        durationMs: { type: integer }

    ErrorResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }
